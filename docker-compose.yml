version: '3.8'

services:
  propagation-service:
    build:
      context: .
      dockerfile: services/propagation/Dockerfile
    container_name: orbitalguard-propagation
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./orbitalguard.db
      - OFFLINE_MODE=false
      - SCREENING_THRESHOLD_KM=50.0
    restart: unless-stopped

