<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrbitWatch</title>
<meta name="description" content="Satellite and space-debris tracking with close-approach alerts: the full catalogue, the history of every orbit, and SGP4 screening of watched satellites.">
<meta name="theme-color" content="#06080b">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js" defer></script>
<script type="module" src="/js/app.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" aria-label="OrbitWatch home">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="6" fill="currentColor"/>
      <ellipse cx="16" cy="16" rx="14.2" ry="5.4" fill="none" stroke="currentColor" stroke-width="1.4" transform="rotate(-28 16 16)"/>
      <circle cx="27.9" cy="9.9" r="2.2" fill="#ff6b2c"/>
    </svg>
    <span class="brand-name">OrbitWatch</span>
  </a>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="userbox" id="userbox"></div>
</header>
<main id="view" class="view" tabindex="-1"></main>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
